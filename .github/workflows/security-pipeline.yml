name: ResponseOne Security Pipeline

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

permissions:
  contents: read
  security-events: write
jobs:
  sast:
    name: Semgrep SAST
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Ensure output dir exists
        run: mkdir -p scans/sast
      - name: Run Semgrep (JSON)
        run: |
          semgrep scan --config auto --json --output scans/sast/semgrep-results.json app/
      - name: Run Semgrep (SARIF)
        run: |
          semgrep scan --config auto --sarif --output scans/sast/semgrep-results.sarif app/
      - name: Upload SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: scans/sast/semgrep-results.sarif
      - name: Upload scan results as artifact
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-scan-results
          path: scans/sast/
  secrets:
    name: Gitleaks Secret Scan
    runs-on: ubuntu-latest
    container:
      image: zricethezav/gitleaks:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Ensure output dir exists
        run: mkdir -p scans/secrets/juice-shop

      - name: Run Gitleaks (SARIF)
        run: |
          gitleaks detect \
            --source=. \
            --report-format=sarif \
            --report-path=scans/secrets/juice-shop/gitleaks-results.sarif \
            --no-git \
            --exit-code=0

      - name: Upload SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: scans/secrets/juice-shop/gitleaks-results.sarif

      - name: Upload scan results as artifact
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-scan-results
          path: scans/secrets/juice-shop/
  dast:
    name: OWASP ZAP DAST
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Create DAST output directory
        run: mkdir -p scans/dast/juice-shop

      - name: Start OWASP Juice Shop
        run: |
          docker run -d \
            --name juice-shop \
            -p 3000:3000 \
            bkimminich/juice-shop

      - name: Wait for Juice Shop
        run: |
          for i in {1..30}; do
            if curl -fs http://localhost:3000 > /dev/null; then
              echo "Juice Shop is ready."
              exit 0
            fi
            echo "Waiting for Juice Shop..."
            sleep 2
          done

          echo "Juice Shop failed to start."
          docker logs juice-shop
          exit 1

      - name: Prepare ZAP output directory
        run: |
          mkdir -p scans/dast/juice-shop
          chmod -R 777 scans/dast/juice-shop

      - name: Run OWASP ZAP Baseline Scan
        run: |
          docker run --rm \
            --network host \
            -v "${{ github.workspace }}/scans/dast/juice-shop:/zap/wrk/:rw" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py \
            -t http://127.0.0.1:3000 \
            -r juice-shop-dast-report.html \
            -J juice-shop-dast-report.json

      - name: Upload ZAP DAST results
        uses: actions/upload-artifact@v4
        with:
          name: juice-shop-zap-dast-results
          path: scans/dast/juice-shop/
