name: ResponseOne Security Pipeline

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

permissions:
  contents: read
  security-events: write

jobs:
  sast:
    name: Semgrep SAST
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Ensure output directory exists
        run: mkdir -p scans/sast/juice-shop

      - name: Run Semgrep on OWASP Juice Shop (JSON)
        run: |
          semgrep scan \
            --config auto \
            --json \
            --output scans/sast/juice-shop/semgrep-results.json \
            app/juice-shop/

      - name: Run Semgrep on OWASP Juice Shop (SARIF)
        run: |
          semgrep scan \
            --config auto \
            --sarif \
            --output scans/sast/juice-shop/semgrep-results.sarif \
            app/juice-shop/

      - name: Upload SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: scans/sast/juice-shop/semgrep-results.sarif

      - name: Upload Juice Shop SAST results as artifact
        uses: actions/upload-artifact@v4
        with:
          name: juice-shop-semgrep-sast-results
          path: scans/sast/juice-shop/name: ResponseOne Security Pipeline

