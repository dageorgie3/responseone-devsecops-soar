name: ResponseOne Security Pipeline

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

permissions:
  contents: read
  security-events: write
jobs:
  sast:
    name: Semgrep SAST
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Ensure output dir exists
        run: mkdir -p scans/sast
      - name: Run Semgrep (JSON)
        run: |
          semgrep scan --config auto --json --output scans/sast/semgrep-results.json app/
      - name: Run Semgrep (SARIF)
        run: |
          semgrep scan --config auto --sarif --output scans/sast/semgrep-results.sarif app/
      - name: Upload SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: scans/sast/semgrep-results.sarif
      - name: Upload scan results as artifact
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-scan-results
          path: scans/sast/
  secrets:
    name: Gitleaks Secret Scan
    runs-on: ubuntu-latest
    container:
      image: zricethezav/gitleaks:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Ensure output dir exists
        run: mkdir -p scans/secrets/juice-shop

      - name: Run Gitleaks (SARIF)
        run: |
          gitleaks detect \
            --source=. \
            --report-format=sarif \
            --report-path=scans/secrets/juice-shop/gitleaks-results.sarif \
            --no-git \
            --exit-code=0

      - name: Upload SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: scans/secrets/juice-shop/gitleaks-results.sarif

      - name: Upload scan results as artifact
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-scan-results
          path: scans/secrets/juice-shop/
  dast:
    name: OWASP ZAP DAST
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Create DAST output directory
        run: mkdir -p scans/dast/juice-shop

      - name: Start OWASP Juice Shop
        run: |
          docker run -d \
            --name juice-shop \
            -p 3000:3000 \
            bkimminich/juice-shop

      - name: Wait for Juice Shop
        run: |
          for i in {1..30}; do
            if curl -fs http://localhost:3000 > /dev/null; then
              echo "Juice Shop is ready."
              exit 0
            fi
            echo "Waiting for Juice Shop..."
            sleep 2
          done

          echo "Juice Shop failed to start."
          docker logs juice-shop
          exit 1

      - name: Prepare ZAP output directory
        run: |
          mkdir -p scans/dast/juice-shop
          chmod -R 777 scans/dast/juice-shop

      - name: Run OWASP ZAP Baseline Scan
        run: |
          docker run --rm \
            --network host \
            -v "${{ github.workspace }}/scans/dast/juice-shop:/zap/wrk/:rw" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py \
            -t http://127.0.0.1:3000 \
            -r juice-shop-dast-report.html \
            -J juice-shop-dast-report.json \
            -I

      - name: Upload ZAP DAST results
        uses: actions/upload-artifact@v4
        with:
          name: juice-shop-zap-dast-results
          path: scans/dast/juice-shop/

  security-gate:
    name: Security Gate
    runs-on: ubuntu-latest

    needs:
      - sast
      - secrets
      - dast

    steps:
      - name: Download Semgrep results
        uses: actions/download-artifact@v4
        with:
          name: semgrep-scan-results
          path: gate-results/semgrep

      - name: Download Gitleaks results
        uses: actions/download-artifact@v4
        with:
          name: gitleaks-scan-results
          path: gate-results/gitleaks

      - name: Download ZAP results
        uses: actions/download-artifact@v4
        with:
          name: juice-shop-zap-dast-results
          path: gate-results/zap

      - name: Check security thresholds
        run: |
          echo "======================================"
          echo "       RESPONSEONE SECURITY GATE"
          echo "======================================"

          echo ""
          echo "Threshold policy:"
          echo "Semgrep:  High/Critical = BLOCK"
          echo "Gitleaks: Any secret = BLOCK"
          echo "ZAP:      High = BLOCK"
          echo "Medium/Low findings = REPORT ONLY"
          echo ""

          # -----------------------------
          # SEMGREP THRESHOLD
          # -----------------------------
          python3 - <<'PY'
          import json
          import sys

          path = "gate-results/semgrep/semgrep-results.json"

          try:
              with open(path) as f:
                  data = json.load(f)

              findings = data.get("results", [])

              high = 0
              critical = 0

              for finding in findings:
                  severity = finding.get("extra", {}).get("severity", "").upper()

                  if severity == "ERROR":
                      high += 1
                  elif severity == "CRITICAL":
                      critical += 1

              print(f"Semgrep findings: {len(findings)}")
              print(f"High/Error: {high}")
              print(f"Critical: {critical}")

              if high > 0 or critical > 0:
                  print("SECURITY GATE: Semgrep threshold exceeded.")
                  sys.exit(1)

              print("SECURITY GATE: Semgrep threshold passed.")

          except FileNotFoundError:
              print("Semgrep report not found.")
              sys.exit(1)
          PY

          # -----------------------------
          # GITLEAKS THRESHOLD
          # -----------------------------
          python3 - <<'PY'
          import json
          import glob
          import sys

          files = glob.glob("gate-results/gitleaks/**/*.sarif", recursive=True)

          if not files:
              print("Gitleaks SARIF report not found.")
              sys.exit(1)

          with open(files[0]) as f:
              data = json.load(f)

          findings = []

          for run in data.get("runs", []):
              findings.extend(run.get("results", []))

          print(f"Gitleaks findings: {len(findings)}")

          if len(findings) > 0:
              print("SECURITY GATE: Secret detected.")
              sys.exit(1)

          print("SECURITY GATE: Gitleaks threshold passed.")
          PY

          # -----------------------------
          # ZAP THRESHOLD
          # -----------------------------
          python3 - <<'PY'
          import json
          import glob
          import sys

          files = glob.glob("gate-results/zap/**/*.json", recursive=True)

          if not files:
              print("ZAP JSON report not found.")
              sys.exit(1)

          with open(files[0]) as f:
              data = json.load(f)

          high = 0

          for site in data.get("site", []):
              for alert in site.get("alerts", []):
                  risk = alert.get("riskdesc", "").upper()

                  if risk.startswith("HIGH"):
                      high += 1

          print(f"ZAP High findings: {high}")

          if high > 0:
              print("SECURITY GATE: ZAP High-risk threshold exceeded.")
              sys.exit(1)

          print("SECURITY GATE: ZAP threshold passed.")
          PY

          echo ""
          echo "======================================"
          echo "SECURITY GATE PASSED"
          echo "======================================"
  soar-notification:
    name: SOAR Security Notification
    runs-on: ubuntu-latest

    needs:
      - security-gate

    if: ${{ always() }}

    steps:
      - name: Download Semgrep results
        uses: actions/download-artifact@v4
        with:
          name: semgrep-scan-results
          path: soar-results/semgrep

      - name: Download Gitleaks results
        uses: actions/download-artifact@v4
        with:
          name: gitleaks-scan-results
          path: soar-results/gitleaks

      - name: Download ZAP results
        uses: actions/download-artifact@v4
        with:
          name: juice-shop-zap-dast-results
          path: soar-results/zap

      - name: Build security alert
        id: build-alert
        env:
          GATE_RESULT: ${{ needs.security-gate.result }}
        run: |
          python3 - <<'PY'
          import json
          import glob
          import os

          gate_result = os.environ.get("GATE_RESULT", "unknown")

          status = "PASSED" if gate_result == "success" else "BLOCKED"

          # -----------------------------
          # SEMGREP
          # -----------------------------
          semgrep_files = glob.glob(
              "soar-results/semgrep/**/semgrep-results.json",
              recursive=True
          )

          semgrep_findings = []
          semgrep_high = 0
          semgrep_critical = 0

          if semgrep_files:
              with open(semgrep_files[0]) as f:
                  data = json.load(f)

              for finding in data.get("results", []):
                  extra = finding.get("extra", {})
                  severity = extra.get("severity", "").upper()

                  if severity == "ERROR":
                      semgrep_high += 1
                  elif severity == "CRITICAL":
                      semgrep_critical += 1

                  if severity in ["ERROR", "CRITICAL"]:
                      semgrep_findings.append({
                          "rule": finding.get("check_id"),
                          "file": finding.get("path"),
                          "line": finding.get("start", {}).get("line"),
                          "severity": severity,
                          "message": extra.get("message", "")
                      })

          # -----------------------------
          # GITLEAKS
          # -----------------------------
          gitleaks_files = glob.glob(
              "soar-results/gitleaks/**/*.sarif",
              recursive=True
          )

          gitleaks_count = 0

          if gitleaks_files:
              with open(gitleaks_files[0]) as f:
                  data = json.load(f)

              for run in data.get("runs", []):
                  gitleaks_count += len(run.get("results", []))

          # -----------------------------
          # ZAP
          # -----------------------------
          zap_files = glob.glob(
              "soar-results/zap/**/*.json",
              recursive=True
          )

          zap_high = 0
          zap_medium = 0
          zap_low = 0

          if zap_files:
              with open(zap_files[0]) as f:
                  data = json.load(f)

              for site in data.get("site", []):
                  for alert in site.get("alerts", []):
                      risk = alert.get("riskdesc", "").upper()

                      if risk.startswith("HIGH"):
                          zap_high += 1
                      elif risk.startswith("MEDIUM"):
                          zap_medium += 1
                      elif risk.startswith("LOW"):
                          zap_low += 1

          # -----------------------------
          # BUILD PAYLOAD
          # -----------------------------
          payload = {
              "pipeline": "ResponseOne Security Pipeline",
              "status": status,
              "gate_result": gate_result,

              "semgrep": {
                  "high": semgrep_high,
                  "critical": semgrep_critical,
                  "blocking_findings": semgrep_findings[:20]
              },

              "gitleaks": {
                  "findings": gitleaks_count
              },

              "zap": {
                  "high": zap_high,
                  "medium": zap_medium,
                  "low": zap_low
              },

              "message": (
                  "Security Gate blocked the pipeline because one or more "
                  "security thresholds were exceeded."
                  if status == "BLOCKED"
                  else
                  "Security Gate passed."
              )
          }

          with open("security-alert.json", "w") as f:
              json.dump(payload, f)

          print(json.dumps(payload, indent=2))
          PY

      - name: Send security alert to Shuffle
        env:
          SHUFFLE_WEBHOOK_URL: ${{ secrets.SHUFFLE_WEBHOOK_URL }}
        run: |
          curl --fail-with-body \
            -X POST "$SHUFFLE_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            --data-binary @security-alert.json

          echo ""
          echo "Security findings sent to Shuffle."
